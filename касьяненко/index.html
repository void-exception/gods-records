<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Gods records</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h2>Gods records</h2>
            <div class="toolbar">
                <button class="tool-btn" onclick="addNote()">➕</button>
                <button class="tool-btn">🗑️</button>
                <button class="tool-btn">📦</button>
                <button class="tool-btn" onclick="logout()">🚪</button>
            </div>
        </div>
        
        <div class="notes-grid" id="notesGrid">
            <!-- Карточки будут добавляться динамически через JS -->
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
