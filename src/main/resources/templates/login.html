<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 60px auto; padding: 20px; }
        h1 { margin-bottom: 20px; }
        label { display: block; margin-top: 12px; font-size: 14px; color: #333; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; cursor: pointer; }
        .error   { color: #c00; margin-top: 12px; }
        .success { color: #080; margin-top: 12px; }
        .link    { margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
<h1>Вход</h1>

<!-- Сообщение об ошибке входа -->
<div class="error" th:if="${param.error}">
    Неверный email или пароль
</div>

<!-- Сообщение после логаута -->
<div class="success" th:if="${param.logout}">
    Вы вышли из системы
</div>

<!--
  ВАЖНО:
  - action="/login" — Spring Security перехватывает этот POST сам
  - поля называются username и password — так Spring ждёт по умолчанию
  - th:action автоматически подставит CSRF-токен в скрытое поле
-->
<form th:action="@{/login}" method="post">
    <label for="username">Email</label>
    <input type="email" id="username" name="username" required autofocus />

    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" required />

    <button type="submit">Войти</button>
</form>

<div class="link">
    Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a>
</div>
</body>
</html>
