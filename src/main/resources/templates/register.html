<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>

    <!-- CSRF-токен на случай, если отключение CSRF для /api/auth/** не сработает -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 60px auto; padding: 20px; }
        h1 { margin-bottom: 20px; }
        label { display: block; margin-top: 12px; font-size: 14px; color: #333; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; cursor: pointer; }
        .error   { color: #c00; margin-top: 12px; }
        .success { color: #080; margin-top: 12px; }
        .link    { margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
<h1>Регистрация</h1>

<div id="errorBox" class="error" style="display:none;"></div>
<div id="successBox" class="success" style="display:none;"></div>

<form id="registerForm">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus />

    <label for="name">Имя</label>
    <input type="text" id="name" name="name" required minlength="2" />

    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" required minlength="8" />
    <small style="color:#666;">Минимум 8 символов, одна заглавная буква и одна цифра</small>

    <button type="submit">Зарегистрироваться</button>
</form>

<div class="link">
    Уже есть аккаунт? <a th:href="@{/login}">Войти</a>
</div>

<script>
    const csrfToken  = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

    const form       = document.getElementById('registerForm');
    const errorBox   = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.style.display = 'none';
        successBox.style.display = 'none';

        const payload = {
            email:    document.getElementById('email').value,
            name:     document.getElementById('name').value,
            password: document.getElementById('password').value
        };

        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify(payload)
            });

            if (res.status === 201) {
                successBox.textContent = 'Аккаунт создан! Сейчас перенаправим на страницу входа…';
                successBox.style.display = 'block';
                setTimeout(() => window.location.href = '/login', 1000);
                return;
            }

            if (res.status === 409) {
                errorBox.textContent = 'Этот email уже зарегистрирован';
                errorBox.style.display = 'block';
                return;
            }

            if (res.status === 400) {
                // Валидация не прошла. Пробуем вытащить сообщения из ответа.
                let msg = 'Проверьте правильность данных';
                try {
                    const body = await res.json();
                    if (body.message) msg = body.message;
                    else if (body.errors) msg = Object.values(body.errors).join(', ');
                } catch (_) {}
                errorBox.textContent = msg;
                errorBox.style.display = 'block';
                return;
            }

            errorBox.textContent = 'Ошибка: ' + res.status;
            errorBox.style.display = 'block';

        } catch (err) {
            errorBox.textContent = 'Сетевая ошибка: ' + err.message;
            errorBox.style.display = 'block';
        }
    });
</script>

</body>
</html>
